    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body, a, button, input, textarea {
        cursor: none;
      }
      body {
        font-family: 'Poppins', sans-serif;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .float-1 { animation: float 6s ease-in-out infinite; animation-delay: 0s; }
      .float-2 { animation: float 6s ease-in-out infinite; animation-delay: 1s; }
      .float-3 { animation: float 6s ease-in-out infinite; animation-delay: 2s; }
      .float-4 { animation: float 6s ease-in-out infinite; animation-delay: 3s; }
      .float-5 { animation: float 6s ease-in-out infinite; animation-delay: 4s; }
      
      /* Animation for elements scrolling into view */
      .scroll-animate {
        opacity: 0;
        transition: opacity 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .scroll-animate.fade-in-up { transform: translateY(30px); }
      .scroll-animate.fade-in-down { transform: translateY(-30px); }
      .scroll-animate.fade-in-left { transform: translateX(-30px); }
      .scroll-animate.fade-in-right { transform: translateX(30px); }
      .scroll-animate.zoom-in { transform: scale(0.95); }

      .scroll-animate.is-visible {
        opacity: 1;
        transform: translateY(0) translateX(0) scale(1);
      }

      /* Background Blob Animation */
      @keyframes animate-blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }

      /* Page Transition Animation */
      @keyframes page-enter-animation {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .page-enter {
        animation: page-enter-animation 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      
      @keyframes testimonial-fade-in {
        from {
          opacity: 0.5;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .testimonial-fade-in {
        animation: testimonial-fade-in 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      /* Logo Gradient Animation */
      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient {
        background-size: 200% 200%;
        animation: gradient-shift 4s ease-in-out infinite;
      }
      
      /* Particle Background Animation */
      @keyframes particle-ascend {
          from {
              transform: translateY(0);
              opacity: 0.7;
          }
          to {
              transform: translateY(-100vh);
              opacity: 0;
          }
      }

      /* Interactive Glass Card Style */
      .glass-card-interactive {
          position: relative;
      }
      .glass-card-interactive:hover {
          border-color: rgba(52, 211, 153, 0.4);
          box-shadow: 0 10px 30px -5px rgba(20, 255, 175, 0.1);
      }
      .glass-card-interactive::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          opacity: 0;
          transition: opacity 0.4s ease-in-out;
          background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(52, 211, 153, 0.15), transparent 80%);
      }
      .glass-card-interactive:hover::before {
          opacity: 1;
      }

    </style>
